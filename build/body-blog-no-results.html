  <section class="section section--tight">
    <div class="wrap">
      <div class="filter-bar">
        <!-- Category and date collapse behind a toggle on a phone; the search
             stays out in the open. display:contents puts them straight back
             into the filter row on wider screens. -->
        <div class="filter-bar__fields" id="blog_filter_fields">
          <div class="filter-bar__field">
            <label class="filter-bar__label" for="blog_category_dropdown">Category</label>
            <select class="input" id="blog_category_dropdown">

            </select>
          </div>
          <div class="filter-bar__field">

            </select>
          </div>
        </div>
        <div class="filter-bar__field filter-bar__field--grow">
          <label class="filter-bar__label" for="blog_search_input">Search</label>
